name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Signing Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > photon-gallery.jks
            echo "storeFile=../photon-gallery.jks" > key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
            echo "keyAlias=$KEY_ALIAS" >> key.properties
            echo "keyPassword=$KEY_PASSWORD" >> key.properties
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Signing keys configured successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore secret provided. Skipping automated release build to avoid uploading mis-signed APKs."
          fi

      - name: Build Release APKs
        if: steps.keystore.outputs.has_keystore == 'true'
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
