name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Photon Gallery
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have tested the latest release before opening an issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: e.g. Google Pixel 8, Samsung Galaxy S23
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android Version / ROM
      placeholder: e.g. Android 14, GrapheneOS, LineageOS 21
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: e.g. v1.0.1 (beta)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat / Crash Logs
      description: Paste any relevant logcat output or stack traces here.
      render: shell
