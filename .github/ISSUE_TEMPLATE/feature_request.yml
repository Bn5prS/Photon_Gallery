name: ✨ Feature Request
description: Suggest an idea or enhancement for Photon Gallery
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement! Please keep in mind that Photon Gallery prioritizes on-device privacy, extreme performance, and Material 3 Expressive UI standards.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? (e.g. I'm always frustrated when...)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see, including any UI/UX ideas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: guidelines
    attributes:
      label: Principles Checklist
      options:
        - label: This feature works completely offline with zero cloud dependency.
          required: true
        - label: This feature complies with Material 3 Expressive design patterns.
          required: true
